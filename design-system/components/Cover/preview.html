<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Trón nélkül</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; width:960px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .sea { fill:var(--ink); }
  .ripple { fill:none; stroke:var(--paper); stroke-width:1.2; }
  .coast { fill:none; stroke:var(--ink); stroke-width:2; }
  .contour { fill:none; stroke:var(--map-relief); stroke-width:1; }
  .route { fill:none; stroke:var(--verdigris); stroke-width:4; stroke-linecap:round; stroke-dasharray:1 10; }
  .route-solid { fill:none; stroke:var(--verdigris); stroke-width:4; stroke-linecap:round; }
  .city { fill:var(--paper-raised); stroke:var(--verdigris); stroke-width:3; }
  .port { fill:var(--paper-raised); stroke:var(--ink); stroke-width:3; }
  .gules { fill:var(--house-voros); }
  .azure { fill:var(--house-kek); }
  .or { fill:var(--house-arany); }
  .pole { stroke:var(--ink); stroke-width:2; }
  .seal { fill:var(--seal); }
  .seal-ring { fill:none; stroke:var(--on-seal); stroke-width:1.5; opacity:.6; }
  .seal-mark { fill:var(--on-seal); opacity:.85; }
  .rose { fill:var(--paper); }
  .rose-ring { fill:none; stroke:var(--paper); stroke-width:1; opacity:.6; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.95; font-weight:500; letter-spacing:.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink sea bleeding off the top, right and bottom edges, cut by a hand-drawn coastline (the largest field) · three house pennants in house-voros / house-kek / house-arany hung from the top edge at unequal lengths (the houses competing) · seal disc r56 bleeding off the bottom (the wax on the orders)
  arrangement a map sheet: land on the left, the sea on the right; pennants stand on the land, the seal sits on the coast where land and sea meet
  pattern     coastline ripples, from the map terrain's own engraving: three paper lines following the coast inside the sea, plus two map-relief contour lines on land; one verdigris route running to the port city
  scales      pennant widths space-8 plus 4, gutters space-4; route stroke 4 with a space-2-ish dot pitch; seal and cities radius-full; everything else square, like a cut map
-->
<defs>

</div>

</div>
