<!-- @dsCard group="Nézetek" height=1320 page subtitle="Város nézet, telefon" -->
<!doctype html>
<html lang="hu">
<head><meta charset="utf-8"><title>VarosNezet</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.TronNelkul, h = React.createElement;
  var HOUSE={tincture:'kek',initial:'K',name:'Kékholló'};
  var RES=[{kind:'arany',value:23,delta:6},{kind:'bp',value:7,delta:-2},{kind:'ke',value:3},{kind:'legit',value:41,delta:4}];
  var NAV=[{id:'terkep',label:'Térkép',icon:'terkep'},{id:'varos',label:'Város',icon:'varos'},{id:'jel',label:'Jelentések',icon:'kem',badge:5},{id:'par',label:'Parancslap',icon:'pp',badge:4},{id:'dip',label:'Diplomácia',icon:'diplomacia'}];
  var FAC={
    nemesseg:{segs:[{name:'Te',tincture:'kek',value:42,self:true},{name:'Ősi Tölgy',tincture:'zold',value:25}],unknown:8,level:'dominans',sus:0,prec:'exact'},
    kereskedok:{segs:[{name:'Ezüstpart-ház',tincture:'arany',value:55},{name:'Te',tincture:'kek',value:19.3,self:true},{name:'Varjúvár',tincture:'fekete',value:12}],level:'jelenlet',sus:1,prec:'band5'},
    katonasag:{segs:[{name:'Varjúvár',tincture:'fekete',value:38},{name:'Ezüstpart-ház',tincture:'arany',value:14}],level:null,sus:0,prec:'band10'}};
  var DNAME={nemesseg:'Felsőváros',kereskedok:'Vásártér',katonasag:'Citadella'};
  function Screen(){
    var st=React.useState('kereskedok'), sel=st[0], f=FAC[sel];
    return h('div',{className:'tn-screen'},
      h(T.AppBar,{house:HOUSE,timer:{at:'20:00',remaining:'3 ó 12 p'},resources:RES}),
      h('main',{className:'tn-screen-body'},
        h('div',{className:'tn-stack',style:{gap:6}},
          h('span',{className:'tn-eyebrow'},'Kikötőváros · kulcsváros · 1 lépés'),
          h('h1',{className:'tn-city-title'},'Feketerév'),
          h('div',{className:'tn-row',style:{gap:8}},h(T.StabilityChip,{level:'ingatag'}),h(T.ControlBadge,{level:'dominans'}),h('span',{className:'tn-muted',style:{fontSize:13}},'a Nemességnél'))),
        h(T.CityView,{name:'Feketerév',coast:true,stability:'ingatag',selected:sel,onSelect:st[1],districts:{nemesseg:{dominant:'kek'},kereskedok:{dominant:'arany',contested:null},katonasag:{dominant:'fekete'}}}),
        h(T.Tabs,{active:sel,onChange:st[1],tabs:[{id:'nemesseg',label:'Felsőváros'},{id:'kereskedok',label:'Vásártér'},{id:'katonasag',label:'Citadella'}]}),
        h('section',{className:'tn-card','aria-label':DNAME[sel]},
          h(T.InfluenceBar,{faction:sel,aside:h(T.ControlBadge,{level:f.level}),segments:f.segs,unknown:f.unknown,precision:f.prec}),
          h('div',{className:'tn-fac-meta'},h(T.SuspicionMeter,{value:f.sus}),h('span',{className:'tn-muted',style:{fontSize:13}},'Romlás: 6% / kör')),
          h('div',{className:'tn-row'},h(T.Button,{icon:'kem'},'Kémkedés'),h(T.Button,{variant:'danger',icon:'warning'},'Lejáratás'),h(T.Button,{variant:'primary'},'Pártfogás · 1 PP'))),
        h(T.ReportCard,{kind:'frakcio',tick:'kérés · lejár a 8. körben',title:'A Kereskedők kikötői beruházást kérnek',footer:[h(T.ResourceChip,{key:1,kind:'arany',value:10}),h(T.ResourceChip,{key:2,kind:'pp',value:1}),h(T.Button,{key:3,size:'sm',variant:'quiet'},'Ajánlat tétele')]},'A vámház gerendái korhadnak, a mólók dőlnek. Aki most segít, arra a céh emlékezni fog.')),
      h(T.NavBar,{active:'varos',items:NAV}));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Screen));
</script>
</body>
</html>
