# Trón nélkül – API-szerződés. Ez az egyetlen igazságforrás: a backend és a mobil is ebből generál.
openapi: 3.0.3
info:
  title: Trón nélkül API
  version: 0.0.2
  description: 'A Trón nélkül szerverének API-ja (szabálykönyv v0.2). Ebből generálja a Spring backend az interfészeket és a modelleket (openapi-generator, spring), és a mobil kliens a Dio-alapú kéréseket és a modelleket (dart-dio). Minden hiba RFC 9457 ProblemDetail, a detail mező magyar szöveg. Arany: a játékos készlete tizedes, minden költség egész. Időpontok: ISO-8601.'
servers:
- url: http://localhost:8080
  description: Helyi fejlesztés
tags:
- name: auth
  description: Bejelentkezés
- name: lobby
  description: Játékválasztó és jelentkezés
- name: game
  description: A játék
- name: admin
  description: Fejlesztői végpontok (ADMIN)
security:
- bearerAuth: []
paths:
  /api/auth/discord:
    post:
      operationId: discordLogin
      tags:
      - auth
      summary: Discord-kód cseréje Firebase custom tokenre
      description: A Google- és az Apple-belépés közvetlenül a Firebase-szel megy. A Discord-kódot a szerver ellenőrzi, és Firebase custom tokent ad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTokenResponse'
        default:
          $ref: '#/components/responses/Problem'
      security: []
  /api/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: A bejelentkezett felhasználó (az első hívás létrehozza)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/games:
    get:
      operationId: listGames
      tags:
      - lobby
      summary: Játékok listája, saját házzal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameSummary'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}:
    get:
      operationId: getGame
      tags:
      - lobby
      summary: 'Játék részletei: kezdőhelyek, hátterek, tinktúrák'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/maps/{mapId}:
    get:
      operationId: getMap
      tags:
      - lobby
      summary: 'Térkép: városok, utak, kezdőhelyek, domborzat (gyorsítótárazható)'
      parameters:
      - name: mapId
        in: path
        required: true
        schema:
          type: string
        description: A térkép azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDef'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/join:
    post:
      operationId: joinGame
      tags:
      - lobby
      summary: Jelentkezés (futó játékba az első 3 elszámolásig)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '201':
          description: Létrejött
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummary'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: withdrawGame
      tags:
      - lobby
      summary: Jelentkezés visszavonása (csak a kezdés előtt)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '204':
          description: Visszavonva
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/state:
    get:
      operationId: getState
      tags:
      - game
      summary: A játékos nézete (előtte a szerver lefuttatja az esedékes eseményeket)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/orders:
    post:
      operationId: addOrder
      tags:
      - game
      summary: Parancs a vázlatra
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/orders/{orderId}:
    delete:
      operationId: removeOrder
      tags:
      - game
      summary: Parancs törlése a vázlatról
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        description: A parancs azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/seal:
    post:
      operationId: seal
      tags:
      - game
      summary: 'Lepecsételés: a vázlatból érlelő parancslap lesz (visszavonni nem lehet)'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/intel/{intelId}/offer:
    post:
      operationId: offerIntel
      tags:
      - game
      summary: Kifürkészett parancslap felkínálása egy megnevezett háznak (7.5)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      - name: intelId
        in: path
        required: true
        schema:
          type: string
        description: A kifürkészett terv azonosítója
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/offers/{offerId}/accept:
    post:
      operationId: acceptOffer
      tags:
      - game
      summary: 'Ajánlat elfogadása (letét: fizetés, és azonnal megkapod)'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      - name: offerId
        in: path
        required: true
        schema:
          type: string
        description: Az ajánlat azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/offers/{offerId}/decline:
    post:
      operationId: declineOffer
      tags:
      - game
      summary: Ajánlat elutasítása
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      - name: offerId
        in: path
        required: true
        schema:
          type: string
        description: Az ajánlat azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/reports:
    get:
      operationId: getReports
      tags:
      - game
      summary: Jelentések (a legutóbbi 100)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportView'
        default:
          $ref: '#/components/responses/Problem'
  /api/games/{id}/ranking:
    get:
      operationId: getRanking
      tags:
      - game
      summary: Rangsor Legitimitás szerint
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankRow'
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/games/{id}/start:
    post:
      operationId: adminStart
      tags:
      - admin
      summary: Játék indítása (ADMIN)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/games/{id}/settle:
    post:
      operationId: adminSettle
      tags:
      - admin
      summary: Azonnali elszámolás (ADMIN)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/admin/games/{id}/advance:
    post:
      operationId: adminAdvance
      tags:
      - admin
      summary: 'Az óra előretekerése; minutes = null: a következő eseményig (ADMIN)'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: A játék azonosítója
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResult'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token
  responses:
    Problem:
      description: Hiba (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ActionInfo:
      type: object
      description: 'gold: null, ha számolt (részesedés, kivásárlás, védekezés).'
      required:
      - id
      - label
      - branch
      - pp
      - gold
      properties:
        id:
          type: string
        label:
          type: string
        branch:
          type: string
        pp:
          type: integer
          format: int32
        gold:
          type: integer
          format: int32
          nullable: true
    AdminResult:
      type: object
      description: Az admin művelet eredménye.
      properties:
        started:
          type: string
          nullable: true
        settlements:
          type: integer
          format: int32
          nullable: true
        advancedMinutes:
          type: integer
          format: int32
          nullable: true
    AdvanceRequest:
      type: object
      required: []
      properties:
        minutes:
          type: integer
          format: int32
          nullable: true
    BackgroundDto:
      type: object
      required:
      - id
      - name
      - icon
      - perks
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        perks:
          type: array
          items:
            type: string
    Buildable:
      type: object
      required:
      - from
      - to
      - fromName
      - toName
      properties:
        from:
          type: string
        to:
          type: string
        fromName:
          type: string
        toName:
          type: string
    Catalog:
      type: object
      required:
      - actions
      - margins
      - programs
      - news
      - rules
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionInfo'
        margins:
          type: array
          items:
            $ref: '#/components/schemas/LevelInfo'
        programs:
          type: array
          items:
            $ref: '#/components/schemas/LevelInfo'
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsTemplateInfo'
        rules:
          $ref: '#/components/schemas/RulesInfo'
    CityDef:
      type: object
      description: Egy városállam a térképen.
      required:
      - id
      - name
      - x
      - y
      - key
      - coast
      - profile
      - goods
      properties:
        id:
          type: string
        name:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        key:
          type: boolean
        coast:
          type: boolean
        profile:
          type: string
        goods:
          type: array
          items:
            $ref: '#/components/schemas/GoodDef'
    CityView:
      type: object
      description: 'reach: reachable | unreachable. present: a városban jelen lévő más házak (hír célpontja lehet). foreignSpies: pletyka a más házak kémeiről (csak a nevük). myProgram: null, ha nincs pártod itt.'
      required:
      - id
      - name
      - profile
      - key
      - coast
      - reach
      - distance
      - myPop
      - taxRate
      - lastTaxPool
      - councilSeats
      - goods
      - pop
      - parties
      - myProgram
      - mySpies
      - myGuards
      - foreignSpies
      - present
      - news
      properties:
        id:
          type: string
        name:
          type: string
        profile:
          type: string
        key:
          type: boolean
        coast:
          type: boolean
        reach:
          type: string
        distance:
          type: integer
          format: int32
          nullable: true
        myPop:
          type: number
          format: double
        taxRate:
          type: number
          format: double
        lastTaxPool:
          type: number
          format: double
          nullable: true
        councilSeats:
          type: integer
          format: int32
        goods:
          type: array
          items:
            $ref: '#/components/schemas/GoodView'
        pop:
          type: array
          items:
            $ref: '#/components/schemas/PopRow'
        parties:
          type: array
          items:
            $ref: '#/components/schemas/PartyView'
        myProgram:
          type: string
          nullable: true
        mySpies:
          type: integer
          format: int32
        myGuards:
          type: integer
          format: int32
        foreignSpies:
          type: array
          items:
            $ref: '#/components/schemas/HouseRef'
        present:
          type: array
          items:
            $ref: '#/components/schemas/HouseRef'
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsView'
    ClockView:
      type: object
      description: 'now: a játék órája (fejlesztéskor előretekerhető). campaign: a következő elszámolás választás, a fesztivál hatása és ára dupla. nextElectionIn: ennyi elszámolás múlva lesz választás.'
      required:
      - now
      - nextSettlementAt
      - settlements
      - maxSettlements
      - nextElectionIn
      - campaign
      - maturationMinutes
      properties:
        now:
          type: string
          format: date-time
        nextSettlementAt:
          type: string
          format: date-time
        settlements:
          type: integer
          format: int32
        maxSettlements:
          type: integer
          format: int32
        nextElectionIn:
          type: integer
          format: int32
        campaign:
          type: boolean
        maturationMinutes:
          type: integer
          format: int32
    Cost:
      type: object
      required:
      - pp
      - gold
      properties:
        pp:
          type: integer
          format: int32
        gold:
          type: integer
          format: int32
    CustomTokenResponse:
      type: object
      description: Firebase custom token a Discord-belépéshez.
      required:
      - customToken
      properties:
        customToken:
          type: string
    DiscordRequest:
      type: object
      description: Discord authorization code + PKCE.
      required:
      - code
      - codeVerifier
      - redirectUri
      properties:
        code:
          type: string
        codeVerifier:
          type: string
        redirectUri:
          type: string
    GameDetail:
      type: object
      required:
      - game
      - starts
      - backgrounds
      - tinctures
      properties:
        game:
          $ref: '#/components/schemas/GameSummary'
        starts:
          type: array
          items:
            $ref: '#/components/schemas/StartSlotDto'
        backgrounds:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundDto'
        tinctures:
          type: array
          items:
            type: string
    GameState:
      type: object
      required:
      - gameId
      - gameName
      - mapId
      - status
      - clock
      - me
      - routes
      - buildable
      - cities
      - draft
      - draftCost
      - lap
      - rivalLaps
      - threats
      - intel
      - offers
      - houses
      - catalog
      properties:
        gameId:
          type: string
        gameName:
          type: string
        mapId:
          type: string
        status:
          type: string
        clock:
          $ref: '#/components/schemas/ClockView'
        me:
          $ref: '#/components/schemas/Me'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteView'
        buildable:
          type: array
          items:
            $ref: '#/components/schemas/Buildable'
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CityView'
        draft:
          type: array
          items:
            $ref: '#/components/schemas/OrderView'
        draftCost:
          $ref: '#/components/schemas/Cost'
        lap:
          allOf:
          - $ref: '#/components/schemas/LapView'
          nullable: true
        rivalLaps:
          type: array
          items:
            $ref: '#/components/schemas/RivalLap'
        threats:
          type: array
          items:
            $ref: '#/components/schemas/Threat'
        intel:
          type: array
          items:
            $ref: '#/components/schemas/IntelView'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/OfferView'
        houses:
          type: array
          items:
            $ref: '#/components/schemas/HouseRef'
        catalog:
          $ref: '#/components/schemas/Catalog'
    GameSummary:
      type: object
      description: round = eddigi elszámolások, maxRounds = a szezon elszámolásai (napi 2).
      required:
      - id
      - name
      - season
      - status
      - mapId
      - startsAt
      - opensAt
      - days
      - roundsPerDay
      - round
      - maxRounds
      - players
      - maxPlayers
      - cities
      - npcCount
      - tags
      - winner
      - myPlace
      - myHouse
      properties:
        id:
          type: string
        name:
          type: string
        season:
          type: string
        status:
          type: string
        mapId:
          type: string
        startsAt:
          type: string
          format: date-time
          nullable: true
        opensAt:
          type: string
          format: date-time
          nullable: true
        days:
          type: integer
          format: int32
        roundsPerDay:
          type: integer
          format: int32
        round:
          type: integer
          format: int32
        maxRounds:
          type: integer
          format: int32
        players:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        cities:
          type: integer
          format: int32
        npcCount:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
        winner:
          type: string
          nullable: true
        myPlace:
          type: integer
          format: int32
          nullable: true
        myHouse:
          allOf:
          - $ref: '#/components/schemas/MyHouse'
          nullable: true
    GoodDef:
      type: object
      description: 'Árucikk: kínálat és kereslet elszámolásonként.'
      required:
      - id
      - name
      - supply
      - demand
      properties:
        id:
          type: string
        name:
          type: string
        supply:
          type: integer
          format: int32
        demand:
          type: integer
          format: int32
    GoodOption:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    GoodView:
      type: object
      description: 'marketValue: egy pont piaci értéke aranyban (az utolsó 3 elszámolás átlagos haszna pontonként × 10).'
      required:
      - id
      - name
      - supply
      - demand
      - cityShares
      - marketValue
      - myShares
      - myMargin
      - sellers
      properties:
        id:
          type: string
        name:
          type: string
        supply:
          type: integer
          format: int32
        demand:
          type: integer
          format: int32
        cityShares:
          type: integer
          format: int32
        marketValue:
          type: number
          format: double
        myShares:
          type: integer
          format: int32
        myMargin:
          type: string
          nullable: true
        sellers:
          type: array
          items:
            $ref: '#/components/schemas/Seller'
    HouseRef:
      type: object
      required:
      - playerId
      - name
      - tincture
      - npc
      - self
      properties:
        playerId:
          type: string
        name:
          type: string
        tincture:
