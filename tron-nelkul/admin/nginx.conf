# SPA + same-origin API proxy. nginx template: ${BACKEND_URL} is filled in at container start (default
# http://backend:8080, the compose service; http://host.docker.internal:8080 for a backend running on the host).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resolve the backend at request time, so nginx starts even if the backend is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend ${BACKEND_URL};

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed bundles: cache long.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # History fallback; index.html is never cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
