# Local run: `docker compose up -d db` starts the database only,
# `docker compose up -d --build` everything: backend, admin, Prometheus, Loki, Grafana (see README, Monitoring).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tron
      POSTGRES_USER: tron
      POSTGRES_PASSWORD: tron
    ports:
      - "5432:5432"
    volumes:
      - tron-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tron -d tron"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: tron-nelkul/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/tron
      DB_USER: tron
      DB_PASSWORD: tron
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-city-proto}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SPRING_PROFILES_ACTIVE: loki
      LOKI_URL: http://loki:3100/loki/api/v1/push
      # For Discord sign-in: the Firebase service account key (see README, chapter 2)
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    # volumes:
    #   - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"
      # Actuator (health, Prometheus metrics): localhost only, never public
      - "127.0.0.1:8091:8091"

  # Angular admin app (nginx), proxies /api/ to backend:8080
  admin:
    build:
      context: ../admin
    environment:
      # Backend running on the host (IDE / bootRun): ADMIN_BACKEND_URL=http://host.docker.internal:8080
      # and start the admin alone with `docker compose up -d --no-deps admin`.
      BACKEND_URL: ${ADMIN_BACKEND_URL:-http://backend:8080}
    depends_on:
      - backend
    ports:
      - "8081:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tron-prometheus:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - tron-loki:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/tron-server.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - tron-grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  tron-db:
  tron-prometheus:
  tron-loki:
  tron-grafana:
