# Local run: `docker compose up -d db` starts the database only,
# `docker compose up --build` the backend too.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tron
      POSTGRES_USER: tron
      POSTGRES_PASSWORD: tron
    ports:
      - "5432:5432"
    volumes:
      - tron-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tron -d tron"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: tron-nelkul/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tron
      DB_USER: tron
      DB_PASSWORD: tron
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-city-proto}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # For Discord sign-in: the Firebase service account key (see README, chapter 2)
      # GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    # volumes:
    #   - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    ports:
      - "8080:8080"

volumes:
  tron-db:
