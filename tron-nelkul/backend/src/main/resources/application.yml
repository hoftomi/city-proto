spring:
  application:
    name: tron-nelkul
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tron}
    username: ${DB_USER:tron}
    password: ${DB_PASSWORD:tron}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # the schema is managed by Flyway (db/migration)
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

# Actuator on its own port: the public API port (8080) does not expose metrics. Keep 8091 off the internet.
management:
  server:
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: tron-backend
    distribution:
      # histogram buckets → p50/p95/p99 by uri in Prometheus (histogram_quantile)
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: tron-backend

app:
  zone: Europe/Budapest
  auth:
    # Firebase project id: its ID tokens are accepted
    firebase-project-id: ${FIREBASE_PROJECT_ID:city-proto}
    # Discord sign-in also needs a service account to sign Firebase custom tokens (GOOGLE_APPLICATION_CREDENTIALS)
    discord-client-id: ${DISCORD_CLIENT_ID:}
    discord-client-secret: ${DISCORD_CLIENT_SECRET:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
  # tron_* game gauges (GameMetrics): aggregate DB queries, refreshed this often, not on every scrape
  metrics-refresh-seconds: ${METRICS_REFRESH_SECONDS:30}
