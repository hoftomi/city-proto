spring:
  application:
    name: tron-nelkul
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tron}
    username: ${DB_USER:tron}
    password: ${DB_PASSWORD:tron}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # a sémát a Flyway kezeli (db/migration)
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  zone: Europe/Budapest
  auth:
    # A Firebase-projekt azonosítója: ennek az ID tokenjeit fogadjuk el
    firebase-project-id: ${FIREBASE_PROJECT_ID:city-proto}
    # A Discord-belépéshez a Firebase custom tokenek aláírására service account is kell (GOOGLE_APPLICATION_CREDENTIALS)
    discord-client-id: ${DISCORD_CLIENT_ID:}
    discord-client-secret: ${DISCORD_CLIENT_SECRET:}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
