name: tron_nelkul
description: Trón nélkül – aszinkron, befolyás alapú stratégiai játék (mobil kliens).
publish_to: none
version: 0.0.1+1

environment:
  sdk: 3.13.4   # Flutter 3.47 (Dart 3.13)

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  flutter_web_auth_2: ^4.1.0
  crypto: ^3.0.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_fonts: ^6.3.0
  path_drawing: ^1.0.1
  flutter_svg: ^2.3.0
  # Architektúra (a ktk mintájára): bloc + go_router + get_it/injectable, rétegek: datasource → repository → service → bloc → widget
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  go_router: ^18.0.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  either_dart: ^1.0.0
  dio: ^5.11.1
  # Feliratok: a backend /api/i18n végpontjáról (TranslationRepository), offline a gyorsítótárból
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.5
  # Az api/openapi.yaml-ból generált kliens (tools/generate_api.sh)
  tron_api:
    path: packages/tron_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/k4/icons/
    - assets/k4/login.svg
    # A térkép és a városkép rajzai (tools/k4_export)
    - assets/k4/k4.json
    - assets/k4/map/
    - assets/k4/cities/
    - assets/k4/estates/
    - assets/k4/cityview/
    # A Cinzel és a Nunito Sans (OFL) offline is betöltődik, a google_fonts innen veszi őket
    - assets/google_fonts/
    # Tartalék feliratok első indításhoz hálózat nélkül (tools/sync_translations.py a backend i18n fájljaiból)
    - assets/translations/
